name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: backend · maven test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile + run tests (H2 in test profile)
        working-directory: backend
        run: ./mvnw --no-transfer-progress -B verify

  frontend:
    name: frontend · vite build + vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Verify OpenAPI codegen is up-to-date
        working-directory: frontend
        run: |
          npm run generate:api
          git diff --exit-code src/api/generated/schema.ts \
            || (echo "::error::src/api/generated/schema.ts is stale — run 'npm run generate:api' and commit." && exit 1)

      - name: Test
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build
