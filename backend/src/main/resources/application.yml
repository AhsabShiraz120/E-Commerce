spring:
  application:
    name: bookworm-backend
  profiles:
    default: dev

  datasource:
    url: ${BOOKWORM_DB_URL:jdbc:postgresql://localhost:5432/bookworm}
    username: ${BOOKWORM_DB_USER:bookworm}
    password: ${BOOKWORM_DB_PASSWORD:bookworm}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

app:
  jwt:
    # HS256 secret — must be at least 32 bytes. Overridden via BOOKWORM_JWT_SECRET in prod.
    secret: ${BOOKWORM_JWT_SECRET:change-me-change-me-change-me-change-me-change-me}
    access-ttl-minutes: 15
    refresh-ttl-days: 7
    issuer: bookworm

logging:
  level:
    root: INFO
    com.bookworm: DEBUG
    org.hibernate.SQL: INFO
